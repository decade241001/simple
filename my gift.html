<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catch the Heart!</title>
    <style>
      body {
        background: #ffcccb;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
      }
      .game-container {
        position: relative;
        width: 100%;
        max-width: 600px;
        height: 80vh;
        margin: 20px auto;
        border: 2px solid #fff;
        background-color: #fff0f0;
        overflow: hidden;
      }
      #heart {
        position: absolute;
        font-size: 2em;
        cursor: pointer;
        user-select: none;
      }
      #message {
        font-size: 1.5em;
        color: #d6336c;
        margin-top: 20px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Catch the Heart Game!</h1>
    <p>Click the heart 10 times to reveal a special message!</p>
    <div class="game-container" id="gameContainer">
      <div id="heart">❤️</div>
    </div>
    <p>Score: <span id="score">0</span></p>
    <div id="message">
      I really like you! Every moment with you lights up my day, and I hope we
      can share countless smiles together.
    </div>

    <script>
      let score = 0,
        target = 10;
      const heart = document.getElementById("heart");
      const scoreDisplay = document.getElementById("score");
      const message = document.getElementById("message");
      const gameContainer = document.getElementById("gameContainer");

      // Move heart to a random position within the container
      function moveHeart() {
        const containerRect = gameContainer.getBoundingClientRect();
        const heartRect = heart.getBoundingClientRect();
        const maxX = containerRect.width - heartRect.width;
        const maxY = containerRect.height - heartRect.height;
        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;
        heart.style.left = randomX + "px";
        heart.style.top = randomY + "px";
      }

      // Handle heart click event
      heart.addEventListener("click", function () {
        score++;
        scoreDisplay.textContent = score;
        if (score >= target) {
          message.style.display = "block";
          heart.style.display = "none";
        } else {
          moveHeart();
        }
      });

      // Initial heart position
      moveHeart();
    </script>
  </body>
</html>
